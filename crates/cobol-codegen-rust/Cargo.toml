[package]
name = "cobol-codegen-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Rust backend for the COBOL-to-Rust converter"
repository = "https://github.com/mearaxera-maker/cobol-packed"

[dependencies]
cobol-ir = { version = "0.1.0", path = "../cobol-ir" }
cobol-platform = { version = "0.1.0", path = "../cobol-platform" }
cobol-record = { version = "0.1.0", path = "../cobol-record" }
cobol-sema = { version = "0.1.0", path = "../cobol-sema" }
cobol-source = { version = "0.1.0", path = "../cobol-source" }
cobol-syntax = { version = "0.1.0", path = "../cobol-syntax" }
cobol-text = { version = "0.1.0", path = "../cobol-text" }
rust_decimal = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
