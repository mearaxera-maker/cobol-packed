[package]
name = "cobol-vm"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Executable COBOL value and condition semantics for generated Rust"
repository = "https://github.com/mearaxera-maker/cobol-packed"

[dependencies]
cobol-dialect = { version = "0.1.0", path = "../cobol-dialect" }
cobol-platform = { version = "0.1.0", path = "../cobol-platform" }
cobol-record = { version = "0.1.0", path = "../cobol-record" }
rust_decimal = "1.36"
thiserror = "2.0"
